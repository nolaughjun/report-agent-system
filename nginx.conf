# nginx.conf — 负载均衡配置
"""Nginx 反向代理和负载均衡配置

特性：
1. 多实例负载均衡
2. SSL/TLS 支持
3. 请求限流
4. 静态文件缓存
5. 健康检查
"""

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;
    gzip_min_length 1000;

    # 请求体大小限制
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # ══════════════════════════════════════════════════════════════
    # 限流配置
    # ══════════════════════════════════════════════════════════════

    # 定义限流区域
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $http_x_user_id zone=user_limit:10m rate=5r/s;

    # 限流状态码
    limit_req_status 429;

    # ══════════════════════════════════════════════════════════════
    # 上游服务 - API 服务池
    # ══════════════════════════════════════════════════════════════

    upstream api_backend {
        # 负载均衡算法：最少连接
        least_conn;

        # API 服务实例
        server api_1:8000 weight=1 max_fails=3 fail_timeout=30s;
        server api_2:8000 weight=1 max_fails=3 fail_timeout=30s;
        server api_3:8000 weight=1 max_fails=3 fail_timeout=30s;

        # 备用服务器（当所有主服务器不可用时）
        server api_4:8000 backup;

        # 健康检查（需要 nginx-plus 或第三方模块）
        # health_check interval=5s fails=3 passes=2;

        # 保持连接
        keepalive 32;
    }

    # ══════════════════════════════════════════════════════════════
    # HTTP 服务器（重定向到 HTTPS）
    # ══════════════════════════════════════════════════════════════

    server {
        listen 80;
        server_name _;

        # 健康检查端点（不重定向）
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # 其他请求重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ══════════════════════════════════════════════════════════════
    # HTTPS 服务器
    # ══════════════════════════════════════════════════════════════

    server {
        listen 443 ssl http2;
        server_name _;

        # SSL 配置
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # 安全头
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ══════════════════════════════════════════════════════════
        # API 路由
        # ══════════════════════════════════════════════════════════

        location /api/ {
            # 限流
            limit_req zone=api_limit burst=20 nodelay;

            # 代理配置
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            # 请求头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-ID $http_x_user_id;

            # 连接设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_set_header Connection "";

            # 缓冲
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # 错误处理
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 3;
        }

        # ══════════════════════════════════════════════════════════
        # 健康检查
        # ══════════════════════════════════════════════════════════

        location /health {
            access_log off;
            proxy_pass http://api_backend/health;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # ══════════════════════════════════════════════════════════
        # API 文档
        # ══════════════════════════════════════════════════════════

        location /docs {
            proxy_pass http://api_backend/docs;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://api_backend/redoc;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://api_backend/openapi.json;
            proxy_set_header Host $host;
        }

        # ══════════════════════════════════════════════════════════
        # Flower 监控（可选，生产环境建议限制访问）
        # ══════════════════════════════════════════════════════════

        location /flower/ {
            # 仅允许内网访问
            # allow 10.0.0.0/8;
            # deny all;

            proxy_pass http://flower:5555/;
            proxy_set_header Host $host;
        }

        # ══════════════════════════════════════════════════════════
        # 静态文件（可选）
        # ══════════════════════════════════════════════════════════

        location /static/ {
            alias /app/static/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ══════════════════════════════════════════════════════════
        # 默认路由
        # ══════════════════════════════════════════════════════════

        location / {
            return 404 '{"error": "Not Found", "message": "请使用 /api/ 端点"}';
            default_type application/json;
        }
    }

    # ══════════════════════════════════════════════════════════════
    # 监控端点（可选）
    # ══════════════════════════════════════════════════════════════

    server {
        listen 8080;
        server_name localhost;

        # Nginx 状态
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}
