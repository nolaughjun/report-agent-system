# Kubernetes Secrets - 敏感配置
# 注意：生产环境应使用外部密钥管理（如 Vault、AWS Secrets Manager）
apiVersion: v1
kind: Secret
metadata:
  name: report-agent-secrets
  namespace: report-agent
type: Opaque
stringData:
  # LLM API Keys（生产环境请替换为实际值）
  DEEPSEEK_API_KEY: "your-deepseek-api-key"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

  # 数据源 API Keys
  TAVILY_API_KEY: "your-tavily-api-key"
  SERPER_API_KEY: ""

  # 数据库密码
  POSTGRES_PASSWORD: "postgres"

  # API 认证密钥
  API_KEY: ""

  # JWT 密钥
  JWT_SECRET: "change-this-in-production"
