# Ingress - 入口配置
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: report-agent-ingress
  namespace: report-agent
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "60"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    # 限流配置
    nginx.ingress.kubernetes.io/configuration-snippet: |
      limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
spec:
  tls:
  - hosts:
    - api.example.com
    secretName: report-agent-tls
  rules:
  - host: api.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8000
      - path: /health
        pathType: Exact
        backend:
          service:
            name: api
            port:
              number: 8000
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8000
      - path: /redoc
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8000
